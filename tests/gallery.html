<!doctype html><meta charset="utf-8"><title>Car gallery</title>
<body style="margin:0;background:#9a948a"><canvas id="c" width="1400" height="900"></canvas>
<script type="module">
import { MODELS, paintCar } from '../js/render/cars.js';
const ctx = document.getElementById('c').getContext('2d');
const names = Object.keys(MODELS); let i = 0;
for (const m of names) {
  const col = i % 5, row = Math.floor(i / 5);
  const spec = { model: m, color: ['#b3201f','#e9e9e6','#1f3f6f','#3e6b48','#c9a227'][i % 5], taxi: m === 'versa', route: m === 'combi' ? 'verde' : null, text: 'CENTRO · ENTRADA' };
  if (m === 'combi') spec.color = '#2f9e44';
  if (m === 'ambulancia' || m === 'patrulla') spec.color = '#f6f6f2';
  ctx.save(); ctx.translate(90 + col * 270, 120 + row * 280); ctx.scale(4, 4); paintCar(ctx, spec, 'E'); ctx.restore();
  ctx.save(); ctx.translate(210 + col * 270, 170 + row * 280); ctx.scale(3, 3); paintCar(ctx, spec, i % 2 ? 'N' : 'S'); ctx.restore();
  ctx.fillStyle = '#000'; ctx.font = '14px sans-serif'; ctx.fillText(m, 20 + col * 270, 30 + row * 280);
  i++;
}
</script>
